name: android

# Builds PdfCraft for Android and uploads a ready-to-install APK as a workflow artifact.
# Run it by hand (Actions ▸ android ▸ Run workflow) or push to the `android` branch.
on:
  workflow_dispatch:
  push:
    branches: [android]
    paths:
      - "apps/pdfcraft-android/**"
      - "crates/rfd-shim/**"
      - "crates/arboard-shim/**"
      - ".github/workflows/android.yml"

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi

      - uses: Swatinem/rust-cache@v2
        with:
          key: android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Build the Rust library (arm64 + arm32)
        env:
          # A phone build doesn't need the desktop release profile's thin LTO: it only slows the build.
          CARGO_PROFILE_RELEASE_LTO: "false"
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
          CARGO_PROFILE_RELEASE_STRIP: "symbols"
        run: |
          export ANDROID_NDK_HOME="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          cargo ndk -t arm64-v8a -t armeabi-v7a -o apps/pdfcraft-android/android/app/src/main/jniLibs build --release -p pdfcraft-android

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Package the APK
        working-directory: apps/pdfcraft-android/android
        run: gradle --no-daemon :app:assembleRelease

      - name: Name the APK
        run: |
          mkdir -p dist
          cp apps/pdfcraft-android/android/app/build/outputs/apk/release/app-release*.apk dist/PdfCraft-android-universal.apk
          ls -lh dist

      - uses: actions/upload-artifact@v4
        with:
          name: PdfCraft-android-universal
          path: dist/PdfCraft-android-universal.apk
